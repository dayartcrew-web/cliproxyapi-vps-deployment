# CLIProxyAPI VPS Configuration
# This configuration is optimized for VPS deployment
# Modify according to your needs

###############################################################################
# Server Configuration
###############################################################################

# Server host/interface to bind to
# "" = bind all interfaces (IPv4 + IPv6)
# "0.0.0.0" = bind all IPv4 interfaces only
host: "0.0.0.0"

# Server port (default: 8317)
# Make sure your firewall allows this port
port: 8317

###############################################################################
# TLS/HTTPS Configuration (Optional)
###############################################################################

# Enable HTTPS by setting tls.enable to true and providing certificate paths
tls:
  enable: false
  cert: ""
  key: ""

###############################################################################
# Management API Configuration
###############################################################################

remote-management:
  # Allow remote access to management endpoints
  # Set to true if you want to access management panel from other machines
  # WARNING: Ensure secret-key is strong if enabled
  allow-remote: true

  # Management secret key (required if allow-remote is true)
  # Generate a strong password with: openssl rand -hex 32
  secret-key: "CHANGE_THIS_TO_SECURE_RANDOM_KEY"

  # Disable built-in management control panel (Web UI)
  # - false: Server auto-downloads management.html from GitHub (default)
  # - true: Server skips download, /management.html returns 404
  #   Use this if hosting the UI elsewhere or using API only
  disable-control-panel: false

  # GitHub repository for management panel updates
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

###############################################################################
# Authentication Configuration
###############################################################################

# Directory for storing OAuth tokens and session data
# IMPORTANT: This path is INSIDE the Docker container
# The host directory /opt/cliproxyapi/auths is mounted to this path
auth-dir: "/root/.cli-proxy-api"

# API keys for client authentication
# These keys are generated by install.sh, but you can add/modify here
api-keys:
  - "api-key-1-will-be-generated-by-install-script"
  - "api-key-2-will-be-generated-by-install-script"
  - "api-key-3-will-be-generated-by-install-script"

###############################################################################
# Logging and Debugging
###############################################################################

# Enable debug logging (true for troubleshooting, false for production)
debug: false

# High-traffic mode - reduces memory usage by disabling some features
commercial-mode: false

# Write logs to files instead of stdout (recommended for VPS)
logging-to-file: true

# Maximum total size of log files in MB (0 = unlimited)
logs-max-total-size-mb: 500

# Enable usage statistics
usage-statistics-enabled: true

###############################################################################
# Proxy Configuration (Optional)
###############################################################################

# HTTP/SOCKS5 proxy for upstream connections
# Example: "socks5://user:pass@192.168.1.1:1080/"
proxy-url: ""

# Force model prefix routing
force-model-prefix: false

###############################################################################
# Request Configuration
###############################################################################

# Number of retry attempts for failed requests
request-retry: 3

# Maximum wait time (seconds) before retrying a cooled-down credential
max-retry-interval: 30

###############################################################################
# Quota Management
###############################################################################

quota-exceeded:
  # Automatically switch to another account/project when quota exceeded
  switch-project: true
  # Switch to preview model when quota exceeded
  switch-preview-model: true

###############################################################################
# Load Balancing
###############################################################################

routing:
  # Strategy: "round-robin" or "fill-first"
  # round-robin: Distribute requests evenly across accounts
  # fill-first: Use first account until quota exceeded, then switch
  strategy: "round-robin"

###############################################################################
# WebSocket Configuration
###############################################################################

# Enable authentication for WebSocket API (/v1/ws)
ws-auth: false

###############################################################################
# Fallback Configuration
###############################################################################

# Fallback to local proxy if remote providers are unavailable
fallback:
  # Enable fallback functionality
  enabled: true

  # Automatically start local proxy when fallback is triggered
  auto-start: true

